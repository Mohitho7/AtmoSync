[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atmosync"
version = "0.1.0"
description = "AtmoSync data engineering package for sensor simulation and contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["confluent-kafka>=2.6,<3.0"]

[project.scripts]
atmosync-producer = "atmo_sync.producer:main"
atmosync-processor = "atmo_sync.processor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atmo_sync = ["simulator_config.json"]
